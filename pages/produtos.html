<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produtos · Alfetti</title>
    <link rel="stylesheet" href="../assets/base.css">
    <link rel="stylesheet" href="../assets/componentes.css">
    <link rel="stylesheet" href="../assets/paginas.css">
    <script src="../api/produtos.js" defer></script>
    <script src="../api/auth.js" defer></script>
</head>

<body class="pagina-interna">

    <header class="barra-topo">
        <a class="barra-topo-nome" href="mesas.html">Alfetti</a>

        <nav class="barra-topo-menu" aria-label="Menu principal">
            <span id="usuario-logado"></span>
            <a class="barra-topo-link" href="mesas.html">
                <button type="button" id="botao-mesas" class="botao">Mesas</button>
            </a>
            <a class="barra-topo-link" href="historico.html">
                <button type="button" id="botao-historico" class="botao">Histórico</button>
            </a>
            <a class="barra-topo-link" href="produtos.html" aria-current="page">
                <button type="button" id="botao-produtos" class="botao">Produtos</button>
            </a>
            <a class="barra-topo-link" href="usuarios.html" data-perfil="gerente" hidden>
                <button type="button" id="botao-usuarios" class="botao">Usuários</button>
            </a>
        </nav>

        <div class="barra-topo-usuario">
            <button type="button" id="botao-sair" class="botao">Sair</button>
        </div>
    </header>

    <main class="conteudo">

        <section class="painel" aria-labelledby="titulo-formulario">
            <div class="conteudo-topo">
                <h1 id="titulo-formulario">Produtos</h1>
            </div>

            <p id="mensagem" class="mensagem" role="status" aria-live="polite"></p>

            <h2 class="tabela-titulo">Disponíveis</h2>
            <table class="tabela">
                <caption class="visualmente-oculto">Produtos disponíveis no cardápio</caption>
                <thead>
                    <tr>
                        <th scope="col">Nome</th>
                        <th scope="col">Categoria</th>
                        <th scope="col">Valor</th>
                        <th scope="col" class="so-gerente">Ações</th>
                    </tr>
                </thead>
                <tbody id="lista-produtos"></tbody>
            </table>

            <p id="lista-vazia" class="texto-suave" hidden>Nenhum produto cadastrado.</p>

            <!-- os indisponiveis ficam numa tabela separada, o js so mostra se tiver algum -->
            <div id="secao-indisponiveis" hidden>
                <h2 class="tabela-titulo">Indisponíveis</h2>
                <table class="tabela tabela-inativa">
                    <caption class="visualmente-oculto">Produtos indisponíveis</caption>
                    <thead>
                        <tr>
                            <th scope="col">Nome</th>
                            <th scope="col">Categoria</th>
                            <th scope="col">Valor</th>
                            <th scope="col" class="so-gerente">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="lista-produtos-indisponiveis"></tbody>
                </table>
            </div>

            <div class="formulario-acoes so-gerente">
                <a class="botao" href="cadastro-produto.html">Novo produto</a>
            </div>
        </section>

    </main>
</body>

</html>
