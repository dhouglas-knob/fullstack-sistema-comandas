<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="../assets/base.css">
    <link rel="stylesheet" href="../assets/componentes.css">
    <link rel="stylesheet" href="../assets/paginas.css">
</head>
<body class="pagina-central">
    <main class="cartao-central">
        <div id="login">
            <div id="login-header">
                <h1>Login</h1>
            </div>
            <form action="" method="post">
                <input type="email" name="email" id="input_email" placeholder="Email" required>
                <input type="password" name="pass" id="pass" placeholder="Senha" required> <br>
                <button type="submit" id="botao_entrar" name="botao_entrar">Entrar</button>
            </form>
        </div>
    </main>
</body>
</html>
